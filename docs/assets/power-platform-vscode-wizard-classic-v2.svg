<svg xmlns="http://www.w3.org/2000/svg" width="2172" height="724" viewBox="0 0 2172 724" role="img" aria-labelledby="title description">
  <title id="title">Power Platform VS Code Starter classic workflow, version 2</title>
  <desc id="description">An updated version of the original wide ASCII-style workflow showing guided start, discovery, Spec Kit, Dataverse, app experience, verification, export and Git, and target import.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050809"/>
      <stop offset="1" stop-color="#0a0d0e"/>
    </linearGradient>
    <pattern id="scanlines" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 4.5H5" stroke="#ffffff" stroke-opacity="0.018"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "Cascadia Mono", "IBM Plex Mono", Consolas, monospace; letter-spacing: 0; }
      .panel { fill: #080c0e; stroke-width: 2; }
      .label { fill: #eef4f2; font-size: 18px; font-weight: 700; }
      .small { fill: #c6d0cd; font-size: 13px; }
      .tiny { fill: #aebbb7; font-size: 12px; }
      .command { fill: #dce6e2; font-size: 12px; }
      .arrow { fill: #91a09c; font-size: 27px; }
    </style>
  </defs>

  <rect width="2172" height="724" fill="url(#background)"/>
  <rect width="2172" height="724" fill="url(#scanlines)"/>
  <rect x="12" y="12" width="2148" height="700" fill="none" stroke="#788581" stroke-width="2"/>

  <g class="mono">
    <text x="1086" y="91" text-anchor="middle" fill="#070a0b" stroke="#d7dfdc" stroke-width="2" font-size="79" font-weight="700" filter="url(#softGlow)">Power Platform VS Code Starter</text>
    <path d="M14 118H2158" stroke="#899590" stroke-width="2"/>
    <text x="257" y="142" text-anchor="middle" fill="#57d7f2" font-size="16">GUIDED, BEGINNER-SAFE START</text>
    <text x="1086" y="142" text-anchor="middle" fill="#f2c65d" font-size="16">SPEC-DRIVEN APP DEVELOPMENT IN VS CODE</text>
    <text x="1904" y="142" text-anchor="middle" fill="#43d7a2" font-size="16">REPEATABLE  *  SCRIPTED  *  VERIFIED</text>
  </g>

  <g class="mono">
    <g transform="translate(20 166)" style="color:#57d7f2">
      <rect class="panel" width="238" height="248" rx="4" stroke="currentColor"/>
      <text x="13" y="29" class="label"><tspan fill="currentColor">[1]</tspan> Start</text>
      <text x="13" y="54" class="small">Launch the guided path</text>
      <path d="M13 65H225" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <text x="17" y="96" fill="currentColor" font-size="27">[&gt;_]  READY</text>
      <text x="13" y="127" class="small">* Confirm repository</text>
      <text x="13" y="148" class="small">* Check prerequisites</text>
      <text x="13" y="169" class="small">* Chat or terminal</text>
      <rect x="12" y="187" width="214" height="47" fill="#030607" stroke="#33413d"/>
      <text x="22" y="207" class="tiny">/power-platform-</text>
      <text x="22" y="225" class="tiny">wizard-init</text>
    </g>

    <text x="263" y="296" class="arrow">-&gt;</text>

    <g transform="translate(285 166)" style="color:#42dca0">
      <rect class="panel" width="238" height="248" rx="4" stroke="currentColor"/>
      <text x="13" y="29" class="label"><tspan fill="currentColor">[2]</tspan> Discovery</text>
      <text x="13" y="54" class="small">Understand the domain</text>
      <path d="M13 65H225" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <text x="35" y="103" fill="currentColor" font-size="25">(o)  (USER)</text>
      <text x="13" y="127" class="small">* Architecture intent</text>
      <text x="13" y="148" class="small">* Tasks + outcomes</text>
      <text x="13" y="169" class="small">* Entry table + view</text>
      <rect x="12" y="187" width="214" height="47" fill="#030607" stroke="#33413d"/>
      <text x="22" y="207" class="tiny">answers.md</text>
      <text x="22" y="225" class="tiny">greenfield / retrofit</text>
    </g>

    <text x="528" y="296" class="arrow">-&gt;</text>

    <g transform="translate(550 166)" style="color:#f2c65d">
      <rect class="panel" width="238" height="248" rx="4" stroke="currentColor"/>
      <text x="13" y="29" class="label"><tspan fill="currentColor">[3]</tspan> Spec Kit</text>
      <text x="13" y="54" class="small">Document before build</text>
      <path d="M13 65H225" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <text x="16" y="91" class="tiny">/spec/</text>
      <text x="24" y="111" class="tiny">|-- spec.md</text>
      <text x="24" y="131" class="tiny">|-- plan.md</text>
      <text x="24" y="151" class="tiny">|-- tasks.md</text>
      <text x="24" y="171" class="tiny">`-- acceptance</text>
      <rect x="12" y="187" width="214" height="47" fill="#030607" stroke="#4d452a"/>
      <text x="22" y="207" class="tiny">GATE: planning complete</text>
      <text x="22" y="225" class="tiny">demo script optional</text>
    </g>

    <text x="793" y="296" class="arrow">-&gt;</text>

    <g transform="translate(815 166)" style="color:#ff9b45">
      <rect class="panel" width="238" height="248" rx="4" stroke="currentColor"/>
      <text x="13" y="29" class="label"><tspan fill="currentColor">[4]</tspan> Dataverse</text>
      <text x="13" y="54" class="small">Model data + relationships</text>
      <path d="M13 65H225" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <text x="20" y="91" class="tiny">+------------------+</text>
      <text x="20" y="111" class="tiny">| table   (PK) GUID|</text>
      <text x="20" y="131" class="tiny">| column  Text     |</text>
      <text x="20" y="151" class="tiny">| owner   Lookup   |</text>
      <text x="20" y="171" class="tiny">+------------------+</text>
      <rect x="12" y="187" width="214" height="47" fill="#030607" stroke="#574029"/>
      <text x="22" y="207" class="tiny">15 -&gt; 20 -&gt; 30 -&gt; 40</text>
      <text x="22" y="225" class="tiny">idempotent payload build</text>
    </g>

    <text x="1058" y="296" class="arrow">-&gt;</text>

    <g transform="translate(1080 166)" style="color:#ff6576">
      <rect class="panel" width="238" height="248" rx="4" stroke="currentColor"/>
      <text x="13" y="29" class="label"><tspan fill="currentColor">[5]</tspan> App UX</text>
      <text x="13" y="54" class="small">Build the experience</text>
      <path d="M13 65H225" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <text x="17" y="91" class="tiny">+--FORM--+ +--VIEW--+</text>
      <text x="17" y="111" class="tiny">| fields | | rows   |</text>
      <text x="17" y="131" class="tiny">| BPF    | | filter |</text>
      <text x="17" y="151" class="tiny">+--------+ +--------+</text>
      <text x="17" y="171" class="tiny">review app + sitemap</text>
      <rect x="12" y="187" width="214" height="47" fill="#030607" stroke="#593038"/>
      <text x="22" y="207" class="tiny">50 / 55 / 60 / 62 / 70</text>
      <text x="22" y="225" class="tiny">publish app artifacts</text>
    </g>

    <text x="1323" y="296" class="arrow">-&gt;</text>

    <g transform="translate(1345 166)" style="color:#ac8df8">
      <rect class="panel" width="238" height="248" rx="4" stroke="currentColor"/>
      <text x="13" y="29" class="label"><tspan fill="currentColor">[6]</tspan> Verify</text>
      <text x="13" y="54" class="small">Prove completeness</text>
      <path d="M13 65H225" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <text x="26" y="99" fill="currentColor" font-size="22">[ PASS ]  100%</text>
      <text x="13" y="127" class="small">* Inventory + sync</text>
      <text x="13" y="148" class="small">* Membership report</text>
      <text x="13" y="169" class="small">* Metadata + usability</text>
      <rect x="12" y="187" width="214" height="47" fill="#030607" stroke="#473d66"/>
      <text x="22" y="207" class="tiny">80 -&gt; 81 -&gt; 82</text>
      <text x="22" y="225" class="tiny">GATE: export unlocked</text>
    </g>

    <text x="1588" y="296" class="arrow">-&gt;</text>

    <g transform="translate(1610 166)" style="color:#5ca5f8">
      <rect class="panel" width="238" height="248" rx="4" stroke="currentColor"/>
      <text x="13" y="29" class="label"><tspan fill="currentColor">[7]</tspan> Export / Git</text>
      <text x="13" y="54" class="small">Package + version assets</text>
      <path d="M13 65H225" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <text x="22" y="93" class="tiny">o---o---o  main</text>
      <text x="22" y="115" class="tiny">     \</text>
      <text x="22" y="137" class="tiny">      o---o  feature</text>
      <text x="13" y="169" class="small">export, unpack, review</text>
      <rect x="12" y="187" width="214" height="47" fill="#030607" stroke="#304e68"/>
      <text x="22" y="207" class="tiny">pac export / unpack</text>
      <text x="22" y="225" class="tiny">git diff / test / commit</text>
    </g>

    <text x="1853" y="296" class="arrow">-&gt;</text>

    <g transform="translate(1875 166)" style="color:#38d1ba">
      <rect class="panel" width="238" height="248" rx="4" stroke="currentColor"/>
      <text x="13" y="29" class="label"><tspan fill="currentColor">[8]</tspan> Import</text>
      <text x="13" y="54" class="small">Promote to target</text>
      <path d="M13 65H225" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <text x="22" y="103" fill="currentColor" font-size="20">[ZIP]  -&gt;  [ENV]</text>
      <text x="13" y="127" class="small">* Pack solution</text>
      <text x="13" y="148" class="small">* Import to target</text>
      <text x="13" y="169" class="small">* Validate + document</text>
      <rect x="12" y="187" width="214" height="47" fill="#030607" stroke="#285b55"/>
      <text x="22" y="207" class="tiny">pac pack / import</text>
      <text x="22" y="225" class="tiny">target verified</text>
    </g>
  </g>

  <g class="mono">
    <g transform="translate(20 435)">
      <rect class="panel" width="660" height="170" rx="4" stroke="#899590"/>
      <text x="18" y="27" class="label">PowerShell (Example Session)</text>
      <path d="M15 38H645" stroke="#56615d" stroke-dasharray="5 4"/>
      <text x="18" y="66" class="command">PS&gt; pwsh ./scripts/bootstrap/00-prereq-check.ps1</text>
      <text x="18" y="91" class="command">PS&gt; pwsh ./scripts/bootstrap/05-start-wizard.ps1</text>
      <text x="18" y="116" class="command">PS&gt; pwsh ./scripts/bootstrap/15-dry-validate.ps1</text>
      <text x="18" y="141" class="command">PS&gt; pwsh ./scripts/bootstrap/80-post-build-analysis.ps1</text>
      <text x="18" y="161" fill="#42dca0" font-size="12">PASS  workflow validated and ready for export</text>
    </g>

    <g transform="translate(706 435)">
      <rect class="panel" width="900" height="170" rx="4" stroke="#899590"/>
      <text x="18" y="27" class="label">What this gives you:</text>
      <path d="M15 38H885" stroke="#56615d" stroke-dasharray="5 4"/>
      <text x="22" y="69" fill="#42dca0" font-size="17">[+]</text><text x="58" y="69" class="small">Clear requirements and approved decisions</text>
      <text x="22" y="96" fill="#f2c65d" font-size="17">[+]</text><text x="58" y="96" class="small">Consistent schema, UX, and review app</text>
      <text x="22" y="123" fill="#5ca5f8" font-size="17">[+]</text><text x="58" y="123" class="small">Versioned source with membership evidence</text>
      <text x="470" y="69" fill="#42dca0" font-size="17">[+]</text><text x="506" y="69" class="small">Automated, repeatable build and promotion</text>
      <text x="470" y="96" fill="#f2c65d" font-size="17">[+]</text><text x="506" y="96" class="small">Published app with verified navigation</text>
      <text x="470" y="123" fill="#5ca5f8" font-size="17">[+]</text><text x="506" y="123" class="small">Traceable reports, metrics, and build log</text>
      <text x="22" y="153" fill="#c6d0cd" font-size="13">Outcome: a safer path from business intent to a portable Power Platform solution.</text>
    </g>

    <g transform="translate(1632 435)">
      <rect class="panel" width="481" height="170" rx="4" stroke="#899590"/>
      <text x="18" y="27" class="label">Key Principles</text>
      <path d="M15 38H466" stroke="#56615d" stroke-dasharray="5 4"/>
      <text x="22" y="69" fill="#57d7f2" font-size="16">[&gt;_]</text><text x="76" y="69" class="small">Guided start</text>
      <text x="22" y="94" fill="#f2c65d" font-size="16">[DOC]</text><text x="76" y="94" class="small">Plan before build</text>
      <text x="22" y="119" fill="#42dca0" font-size="16">[RERUN]</text><text x="91" y="119" class="small">Idempotent automation</text>
      <text x="22" y="144" fill="#ac8df8" font-size="16">[PASS]</text><text x="84" y="144" class="small">Validate every gate</text>
    </g>
  </g>

  <g class="mono">
    <rect x="20" y="624" width="2093" height="50" fill="#060a0b" stroke="#899590" stroke-width="2"/>
    <text x="1066" y="656" text-anchor="middle" fill="#e3ebe8" font-size="20">GUIDED  *  SPEC-DRIVEN  *  IDEMPOTENT  *  INVENTORIED  *  VERIFIED  *  VERSIONED</text>
    <text x="1066" y="696" text-anchor="middle" fill="#75837e" font-size="13">CLASSIC LAYOUT / UPDATED WORKFLOW / VERSION 2</text>
  </g>
</svg>