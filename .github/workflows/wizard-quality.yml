name: Wizard Quality

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: wizard-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"

      - name: Install pinned PowerShell quality modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $errors = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -Path . -Filter '*.ps1' -File -Recurse |
            Where-Object FullName -NotMatch '[\\/](?:\.git|node_modules|out|\.wizard-metrics)[\\/]' |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              foreach ($parseError in $parseErrors) {
                $errors.Add("$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)") | Out-Null
              }
            }
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings.Count -gt 0) { throw "PSScriptAnalyzer reported $($findings.Count) finding(s)." }

      - name: Parse and validate JSON
        shell: pwsh
        run: ./scripts/ci/test-json-schema.ps1

      - name: Run contract integrity check
        shell: pwsh
        run: ./scripts/ci/test-contract-integrity.ps1

      - name: Run all remaining standalone CI checks
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem ./scripts/ci -Filter 'test-*.ps1' -File |
            Where-Object Name -ne 'test-contract-integrity.ps1' |
            Sort-Object Name)
          foreach ($script in $scripts) {
            Write-Host "Running $($script.Name)"
            & $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($script.Name) exited with code $LASTEXITCODE." }
          }

      - name: Run Pester 5.7.1 suites
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $result = Invoke-Pester -Path ./scripts/ci -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "Pester reported $($result.FailedCount) failed test(s)." }
