name: Framework Windows Root Validation

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - validation/windows-root-241983d6
    paths:
      - .github/workflows/framework-windows-root-validation.yml

jobs:
  windows-root-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 241983d60983df52dc5101310e3037e63e72d5ca
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Windows identity and run existing root regressions
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $requiredCommit = '241983d60983df52dc5101310e3037e63e72d5ca'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'framework-windows-root-validation'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          if (-not $IsWindows -or $env:RUNNER_OS -cne 'Windows') {
            throw 'Genuine Windows execution is required; Linux or simulated results are not accepted.'
          }
          if ($PSVersionTable.PSEdition -cne 'Core' -or $PSVersionTable.PSVersion.Major -lt 7) {
            throw 'PowerShell 7 or later is required.'
          }
          if ($env:GITHUB_REPOSITORY -cne 'bradlaw76/power-platform-vscode-starter') {
            throw 'This validation is restricted to the approved framework repository.'
          }
          $gitVersion = (& git --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git version verification failed.' }
          $testedCommit = (& git rev-parse --verify 'HEAD^{commit}' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify the checked-out commit.' }
          $status = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the validation checkout.' }
          $windows = Get-CimInstance -ClassName Win32_OperatingSystem
          $result = [ordered]@{
            RequiredCommit = $requiredCommit
            TestedCommit = $testedCommit
            WorkflowCommit = $env:GITHUB_SHA
            WorkflowRef = $env:GITHUB_REF
            RunnerOS = $env:RUNNER_OS
            WindowsCaption = $windows.Caption
            WindowsVersion = $windows.Version
            WindowsBuild = $windows.BuildNumber
            PowerShellVersion = $PSVersionTable.PSVersion.ToString()
            GitVersion = $gitVersion
            TestStatus = 'NOT_RUN'
            TestExitCode = $null
            WindowsMixedCaseChecks = 0
            GuardChecks = 0
          }
          $resultPath = Join-Path $evidenceRoot 'results.json'
          $result | ConvertTo-Json | Set-Content -LiteralPath $resultPath -Encoding utf8
          $result | Format-List | Out-String | Write-Host
          if ($testedCommit -cne $requiredCommit) { throw 'Checkout does not match the exact approved implementation SHA.' }
          if ($status.Count -ne 0) { throw 'Validation requires a clean isolated checkout.' }

          $logPath = Join-Path $evidenceRoot 'root-regression.log'
          & pwsh -NoLogo -NoProfile -NonInteractive -File ./scripts/ci/test-framework-context-preflight.ps1 *> $logPath
          $testExitCode = $LASTEXITCODE
          $output = Get-Content -LiteralPath $logPath -Raw
          Write-Host $output
          $mixedCasePassed = $output -match '(?m)^Windows mixed-case root checks: 3 passed\.\s*$'
          $guardPassed = $output -match '(?m)^Framework context preflight: 74 checks passed\.\s*$'
          $windowsSkipped = $output -match 'Windows mixed-case root checks: NOT RUN'
          $passed = $testExitCode -eq 0 -and $mixedCasePassed -and $guardPassed -and -not $windowsSkipped
          $result.TestExitCode = $testExitCode
          $result.WindowsMixedCaseChecks = if ($mixedCasePassed) { 3 } else { 0 }
          $result.GuardChecks = if ($guardPassed) { 74 } else { 0 }
          $result.TestStatus = if ($passed) { 'PASS' } else { 'FAIL' }
          $result | ConvertTo-Json | Set-Content -LiteralPath $resultPath -Encoding utf8
          if (-not $passed) {
            throw "Windows regression failed or did not execute completely: exit=$testExitCode; mixedCase=$mixedCasePassed; guard=$guardPassed; skipped=$windowsSkipped."
          }

      - name: Preserve Windows validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framework-windows-root-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/framework-windows-root-validation
          if-no-files-found: error
          retention-days: 7
